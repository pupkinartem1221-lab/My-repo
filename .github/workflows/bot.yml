name: CRM Bot

on:
  workflow_dispatch:
    inputs:
      init_db:
        description: "Создать новую пустую базу (только для самого первого запуска!)"
        type: boolean
        default: false
  schedule:
    # страховка: если цепочка перезапусков оборвётся, бот поднимется сам
    - cron: "7,37 * * * *"

# одновременно работает только один экземпляр бота; следующий ждёт в очереди
concurrency:
  group: crm-bot
  cancel-in-progress: false

permissions: {}

jobs:
  bot:
    # бот запускается только из основной ветки — код других веток не получит доступ к данным
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # сохранение зашифрованной базы в ветку bot-data
      actions: write    # самоперезапуск и защита от автоотключения
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies (точные версии с проверкой хешей)
        run: pip install --require-hashes --no-deps -r requirements.lock

      - name: Install cloudflared (туннель для мини-приложения, с проверкой контрольной суммы)
        continue-on-error: true
        run: |
          BIN="$RUNNER_TEMP/cloudflared"
          curl -fsSL --retry 3 -o "$BIN" \
            https://github.com/cloudflare/cloudflared/releases/download/2026.11.0/cloudflared-linux-amd64
          echo "51f7c68b57ed7269164075d7e789efce5b59355982f06392deeb037d982a51fd  $BIN" | sha256sum -c -
          chmod +x "$BIN"
          echo "CLOUDFLARED=$BIN" >> "$GITHUB_ENV"
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "PAGES_URL=https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: Keep workflow enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/bot.yml/enable"

      - name: Run bot (5 ч 20 мин)
        timeout-minutes: 335
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PASSWORD_OLD: ${{ secrets.DB_PASSWORD_OLD }}
          # По умолчанию данные хранятся в этом же репозитории. Надёжнее — в отдельном приватном:
          # переменная DATA_REPO=владелец/репозиторий и секрет DATA_TOKEN (см. README).
          DATA_REPO: ${{ vars.DATA_REPO || github.repository }}
          GITHUB_TOKEN: ${{ secrets.DATA_TOKEN || secrets.GITHUB_TOKEN }}
          INIT_DB: ${{ inputs.init_db && '1' || '' }}
          RUN_SECONDS: "19200"
        run: exec python -m bot

      - name: Restart
        if: success() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh workflow run bot.yml --ref main -R "$GITHUB_REPOSITORY" && exit 0
            sleep $((i * 10))
          done
          exit 1

name: CRM Bot

on:
  workflow_dispatch:
  schedule:
    # страховка: если цепочка перезапусков оборвётся, бот поднимется сам в течение ~30 минут
    - cron: "*/30 * * * *"

# одновременно работает только один экземпляр бота; следующий ждёт в очереди
concurrency:
  group: crm-bot
  cancel-in-progress: false

permissions:
  contents: write   # сохранение зашифрованной базы в ветку bot-data
  actions: write    # самоперезапуск

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot (5 ч 20 мин)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_REPO: ${{ github.repository }}
          RUN_SECONDS: "19200"
        run: python -m bot

      - name: Restart
        if: success() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
